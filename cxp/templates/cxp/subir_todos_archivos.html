{% extends "base/base.html" %}
{% block page_content %}
<div class="container mt-4">
  <h3>Subir Archivos - Compra {{ compra.id }}</h3>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    <div class="form-group">
      <label>Archivo Principal:</label>
      <input type="file" name="archivo_pdf" class="form-control">
    </div>
    <div class="form-group">
      <label>Evidencia Recoge:</label>
      <input type="file" name="evidencia_recoge" class="form-control">
    </div>
    <div class="form-group">
      <label>Evidencia Uso:</label>
      <input type="file" name="evidencia_uso" class="form-control">
    </div>
    <button type="submit" class="btn btn-primary">Subir</button>
    <a href="{% url 'cxp:compras_list' %}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
