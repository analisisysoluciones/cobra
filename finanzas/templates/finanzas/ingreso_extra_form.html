{% extends 'base/base.html' %}

{% block page_content %}
<div class="card shadow mb-4">
  <div class="card-header py-3">
    <h6 class="m-0 font-weight-bold text-primary">Registrar Ingreso Extraordinario</h6>
  </div>

  <div class="card-body">
    <form method="post">
      {% csrf_token %}

      <div class="row">

        <!-- FECHA -->
        <div class="col-md-3 mb-3">
          <label><strong>Fecha:</strong></label>
          <input type="date" name="fecha" class="form-control" value="{{ form.fecha.value|default:'' }}" required>
        </div>

        <!-- CUENTA -->
        <div class="col-md-4 mb-3">
          <label><strong>Cuenta:</strong></label>
          {{ form.cuenta }}
        </div>

        <!-- PROYECTO -->
        <div class="col-md-5 mb-3">
          <label><strong>Proyecto (opcional):</strong></label>
          {{ form.proyecto }}
        </div>

      </div>

      <div class="row">

        <!-- TIPO -->
        <div class="col-md-4 mb-3">
          <label><strong>Tipo de ingreso:</strong></label>
          {{ form.tipo }}
        </div>

        <!-- MONTO -->
        <div class="col-md-4 mb-3">
          <label><strong>Monto:</strong></label>
          <input type="number" step="0.01" name="monto" class="form-control" value="{{ form.monto.value|default:'' }}" required>
        </div>

        <!-- REFERENCIA -->
        <div class="col-md-4 mb-3">
          <label><strong>Referencia:</strong></label>
          <input type="text" name="referencia" class="form-control" value="{{ form.referencia.value|default:'' }}">
        </div>

      </div>

      <!-- CONCEPTO -->
      <div class="mb-3">
        <label><strong>Concepto:</strong></label>
        <textarea name="concepto" class="form-control" rows="3" required>{{ form.concepto.value|default:'' }}</textarea>
      </div>

      <button class="btn btn-success"><i class="fas fa-save"></i> Guardar</button>
      <a href="{% url 'finanzas:ingreso_list' %}" class="btn btn-secondary">Cancelar</a>
    </form>
  </div>
</div>
{% endblock page_content %}
