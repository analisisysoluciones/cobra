{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PDA Móvil - Inicio</title>

    <link href="{% static 'base/vendor/fontawesome-free/css/all.min.css' %}" rel="stylesheet">
    <link href="{% static 'base/css/sb-admin-2.min.css' %}" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }
        .mobile-wrap {
            max-width: 520px;
            margin: 0 auto;
            padding: 16px;
        }
        .mobile-card {
            border-radius: 18px;
            box-shadow: 0 0.25rem 1rem rgba(0,0,0,.08);
            border: none;
        }
        .mobile-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2e3a59;
        }
        .mobile-subtitle {
            color: #6c757d;
            font-size: .95rem;
        }
        .btn-mobile {
            min-height: 58px;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 14px;
        }
        .logo-box {
            text-align: center;
            margin-bottom: 1rem;
        }
        .select-mobile {
            min-height: 54px;
            font-size: 1rem;
            border-radius: 12px;
        }
    </style>
</head>
<body>

<div class="mobile-wrap py-4">

    <div class="logo-box">
        <h2 class="mobile-title mb-1">Cobra PDA</h2>
        <div class="mobile-subtitle">Inicio de jornada</div>
    </div>

    <div class="card mobile-card">
        <div class="card-body p-4">

            <div class="mb-4">
                <div class="text-dark font-weight-bold">Usuario</div>
                <div class="text-muted">{{ request.user.username }}</div>
            </div>

            <form method="post" action="{% url 'adm:iniciar_jornada' %}">
                {% csrf_token %}

                <div class="form-group">
                    <label class="font-weight-bold">Selecciona el equipo</label>
                    <select name="equipo" class="form-control select-mobile" required>
                        <option value="">Seleccione...</option>
                        {% for e in equipos %}
                            <option value="{{ e.id }}">
                                {{ e.descripcion }} {% if e.placas %} - {{ e.placas }}{% endif %}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-success btn-block btn-mobile mt-4">
                    <i class="fas fa-play-circle mr-2"></i> Iniciar jornada
                </button>
            </form>

            <a href="{% url 'adm:pda_menu' %}" class="btn btn-light btn-block btn-mobile mt-3">
                <i class="fas fa-arrow-left mr-2"></i> Volver
            </a>

        </div>
    </div>

</div>

</body>
</html>
