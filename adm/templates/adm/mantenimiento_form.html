{% extends 'base/base.html' %}

{% block page_content %}
<div class="card shadow">
    <div class="card-header">
        <h6 class="m-0 font-weight-bold text-primary">Mantenimiento</h6>
    </div>

    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            <div class="form-group">
                <label>Equipo</label>
                {{ form.equipo }}
            </div>

            <div class="form-group">
                <label>Fecha</label>
                {{ form.fecha }}
            </div>

            <div class="form-group">
                <label>Tipo</label>
                {{ form.tipo }}
            </div>

            <div class="form-group">
                <label>Descripción</label>
                {{ form.descripcion }}
            </div>

            <div class="form-group">
                <label>Costo</label>
                {{ form.costo }}
            </div>

            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{% url 'adm:mantenimiento_list' %}" class="btn btn-secondary">Cancelar</a>
        </form>
    </div>
</div>
{% endblock %}
