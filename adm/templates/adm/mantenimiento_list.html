{% extends 'base/base.html' %}

{% block page_content %}
<div class="card shadow mb-4">
    <div class="card-header d-flex justify-content-between">
        <h6 class="m-0 font-weight-bold text-primary">Mantenimiento de Equipos</h6>
        <a href="{% url 'adm:mantenimiento_new' %}" class="btn btn-primary">Nuevo</a>
    </div>

    <div class="card-body">
        <table class="table table-bordered table-hover">
            <thead>
                <tr>
                    <th>Equipo</th>
                    <th>Fecha</th>
                    <th>Tipo</th>
                    <th>Costo</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                {% for m in mantenimientos %}
                <tr>
                    <td>{{ m.equipo }}</td>
                    <td>{{ m.fecha }}</td>
                    <td>{{ m.tipo }}</td>
                    <td>{{ m.costo }}</td>
                    <td>
                        <a href="{% url 'adm:mantenimiento_edit' m.id %}" class="btn btn-warning btn-sm">Editar</a>
                        <a href="{% url 'adm:mantenimiento_delete' m.id %}" class="btn btn-danger btn-sm">Eliminar</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
