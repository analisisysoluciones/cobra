{% extends "base/base.html" %}
{% block page_content %}

<div class="card">
    <div class="card-header">
        <h4>Nueva salida de almacén</h4>
    </div>

    <div class="card-body">
        <form method="post">
            {% csrf_token %}

            <div class="row">
                <div class="col-md-3">
                    <label>Fecha</label>
                    {{ form.fecha }}
                </div>

                <div class="col-md-5">
                    <label>Equipo</label>
                    {{ form.equipo }}
                </div>

                <div class="col-md-4">
                    <label>Orden de servicio</label>
                    {{ form.orden_servicio }}
                </div>
            </div>

            <div class="mt-3">
                <label>Observaciones</label>
                {{ form.observaciones }}
            </div>

            <div class="mt-4 text-end">
                <button class="btn btn-primary">Continuar</button>
            </div>
        </form>
    </div>
</div>

{% endblock %}
