{% extends "base/base.html" %}

{% block page_content %}

<div class="card shadow mb-4">

    <div class="card-header d-flex justify-content-between">
        <h6 class="m-0 font-weight-bold text-primary">Tarifas</h6>

        <a href="{% url 'renta:tarifa_new' %}" class="btn btn-primary">
            Nueva Tarifa
        </a>
    </div>

    <div class="card-body">

        <table class="table table-striped">

            <thead>
                <tr>
                    <th>Equipo</th>
                    <th>Tipo</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                {% for t in tarifas %}
                <tr>
                    <td>{{ t.equipo }}</td>
                    <td>{{ t.tipo_cobro }}</td>
                    <td>${{ t.precio }}</td>

                    <td>
                        <a href="{% url 'renta:tarifa_edit' t.id %}" 
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="4">Sin tarifas</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>

</div>

{% endblock %}
