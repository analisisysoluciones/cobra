{% extends "base/base.html" %}

{% block page_content %}

<div class="card shadow mb-4">

    <div class="card-header d-flex justify-content-between">
        <h6>Clientes</h6>

        <a href="{% url 'renta:cliente_new' %}" class="btn btn-primary">
            Nuevo
        </a>
    </div>

    <div class="card-body">

        <table class="table table-striped">

            <thead>
                <tr>
                    <th>Clave</th>
                    <th>Nombre</th>
                    <th>Teléfono</th>
                    <th>Email</th>
                    <th>Acciones</th>
                </tr>
            </thead>

            <tbody>
                {% for c in clientes %}
                <tr>
                    <td>{{ c.codigo }}</td>
                    <td>{{ c.nombre }}</td>
                    <td>{{ c.telefono }}</td>
                    <td>{{ c.email }}</td>
                    <td>
                        <a href="{% url 'renta:cliente_edit' c.id %}" class="btn btn-warning btn-sm">
                            Editar
                        </a>
                    </td>
                </tr>
                {% empty %}
                <tr>
                    <td colspan="3">Sin clientes</td>
                </tr>
                {% endfor %}
            </tbody>

        </table>

    </div>

</div>

{% endblock %}
