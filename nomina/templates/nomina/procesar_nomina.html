{% extends 'base/base.html' %}

{% block page_content %}
<form method="POST" action="{% url 'nom:procesar_nomina' %}">
    {% csrf_token %}
    <div class="col-xl-6 mb-4">
        <div class="card border-left-primary shadow h-100 py-2">
            <div class="card-body">
                <h5 class="text-primary font-weight-bold mb-4">Procesar Nómina</h5>

                <div class="form-group">
                    <label for="periodo">Seleccionar Período</label>
                    <select name="periodo" id="periodo" class="form-control select2" required>
                        <option value="">-- Selecciona un período --</option>
                        {% for p in periodos %}
                            <option value="{{ p.id }}" {% if selected_periodo_id == p.id|stringformat:"s" %}selected{% endif %}>
                                Semana {{ p.semana }} ({{ p.periodo_inicio }} - {{ p.periodo_final }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <div class="form-group">
                    <label for="cuenta">Cuenta de Pago</label>
                    <select name="cuenta" id="cuenta" class="form-control select2" required>
                        <option value="">-- Selecciona una cuenta --</option>
                        {% for cuenta in cuentas %}
                            <option value="{{ cuenta.id }}" {% if selected_cuenta_id == cuenta.id|stringformat:"s" %}selected{% endif %}>
                                {{ cuenta.cuenta }} — Saldo: ${{ cuenta.saldo_actual|floatformat:2 }}
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <button type="submit" class="btn btn-success">
                    <span class="fa fa-save"></span> Procesar Nómina
                </button>
                <a href="{% url 'nom:calcular_nomina' %}" class="btn btn-secondary">
                    <span class="fa fa-arrow-left"></span> Cancelar
                </a>
            </div>
        </div>
    </div>
</form>
{% endblock page_content %}

{% block js_page %}
<link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.full.min.js"></script>
<script>
    $(document).ready(function() {
        $('.select2').select2();
    });
</script>
{% endblock js_page %}
