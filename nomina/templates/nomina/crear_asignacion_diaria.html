{% extends 'sbadmin/base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="container-fluid">
    <div class="card shadow mb-4">
        <div class="card-header py-3">
            <h6 class="m-0 font-weight-bold text-primary">Registrar Asignación Diaria</h6>
        </div>
        <div class="card-body">
            {% if messages %}
            <div class="alert alert-info">
                {% for message in messages %}
                {{ message }}
                {% endfor %}
            </div>
            {% endif %}
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-primary">Guardar</button>
                <a href="{% url 'nom:seleccionar_fecha' %}" class="btn btn-secondary">Cancelar</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'vendor/select2/select2.min.js' %}"></script>
<link href="{% static 'vendor/select2/select2.min.css' %}" rel="stylesheet" />
<script>
    $(document).ready(function() {
        $('.select2').select2();
    });
</script>
{% endblock %}
