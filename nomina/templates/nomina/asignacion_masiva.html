{% extends 'base/base.html' %}

{% block page_content %}
<div class="card shadow mb-4">
    <div class="card-header d-flex justify-content-between align-items-center">
        <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-hard-hat"></i> Asignación Masiva de Proyecto</h6>
    </div>
    <div class="card-body">

        <!-- Filtro / buscador -->
        <input type="text" id="buscarEmpleado" class="form-control mb-3" placeholder="Buscar empleado...">

        <form method="post">
            {% csrf_token %}
            
            <!-- Tabla de empleados -->
            <table class="table table-bordered" id="empleadosTable">
                <thead>
                    <tr>
                        <th><input type="checkbox" id="selectAll"></th>
                        <th>Empleado</th>
                        <th>Departamento</th>
                    </tr>
                </thead>
                <tbody>
                    {% for emp in empleados %}
                    <tr>
                        <td><input type="checkbox" name="empleados" value="{{ emp.id }}"></td>
                        <td>{{ emp.nombre }}</td>
                        <td>{{ emp.departamento }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>

            <!-- Modal de asignación -->
            <div class="form-row">
                <div class="form-group col-md-4">
                    <label>Proyecto</label>
                    <select name="proyecto" class="form-control select2" style="width:100%;">
                        <option value="">--- Seleccione un Proyecto ---</option>
                        {% for pro in proyectos %}
                        <option value="{{ pro.id }}">{{ pro.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="form-group col-md-4">
                    <label>Fecha</label>
                    <input type="date" name="fecha" class="form-control" value="{{ today|default:None }}">
                </div>
                <div class="form-group col-md-4">
                    <label>Horas trabajadas</label>
                    <input type="number" name="horas_trabajadas" class="form-control" step="0.5" min="0" max="12">
                </div>
            </div>

            <button type="submit" class="btn btn-success"><i class="fas fa-save"></i> Asignar Masivamente</button>
        </form>

    </div>
</div>
{% endblock %}

{% block extra_scripts %}
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<!-- Select2 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<script>
$(document).ready(function(){
    // Select2 para proyecto
    $('.select2').select2({
        placeholder: '--- Seleccione un Proyecto ---',
        width: 'style',
        allowClear: true
    });

    // Buscar empleado en la tabla
    $("#buscarEmpleado").on("keyup", function() {
        var value = $(this).val().toLowerCase();
        $("#empleadosTable tbody tr").filter(function() {
            $(this).toggle($(this).text().toLowerCase().indexOf(value) > -1)
        });
    });

    // Seleccionar todos
    $("#selectAll").click(function(){
        $('input[name="empleados"]').prop('checked', this.checked);
    });
});
</script>
{% endblock %}
