{% extends "base/base.html" %}
{% block page_content %}
<div class="container-fluid">
  <h1 class="h3 mb-4 text-gray-800">Tarifas de Destajo por Obra</h1>
  <a href="{% url 'nom:tarifa_destajo_obra_create' %}" class="btn btn-primary mb-3">+ Nueva Tarifa</a>
  <div class="card shadow">
    <div class="card-body">
      <table class="table table-striped table-bordered">
        <thead>
          <tr>
            <th>Obra</th>
            <th>Tipo de Destajo</th>
            <th>Tarifa</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          {% for t in tarifas %}
          <tr>
            <td>{{ t.obra }}</td>
            <td>{{ t.tipo.nombre }}</td>
            <td>${{ t.tarifa }}</td>
            <td>
              <a href="{% url 'nom:tarifa_destajo_obra_update' t.pk %}" class="btn btn-sm btn-warning">Editar</a>
              <a href="{% url 'nom:tarifa_destajo_obra_delete' t.pk %}" class="btn btn-sm btn-danger">Eliminar</a>
            </td>
          </tr>
          {% empty %}
          <tr><td colspan="4" class="text-center">Sin registros</td></tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
