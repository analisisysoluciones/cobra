{% extends 'base/base.html' %}

{% block page_content %}
<h4>Editar Proyecto para {{ object.empleado.nombre }}</h4>

<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit" class="btn btn-success">Guardar</button>
  <a href="{% url 'nom:asignar_proyecto' object.nomina_historica_id %}" class="btn btn-secondary">Cancelar</a>
</form>
{% endblock %}
